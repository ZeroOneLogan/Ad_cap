<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#0c0c10"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Subtle glow circle -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Crown -->
  <g transform="translate(256, 256) scale(0.7) translate(-256, -256)" filter="url(#glow)">
    <path fill="url(#goldGrad)" d="
      M 128 320
      L 128 200
      L 176 260
      L 220 180
      L 256 260
      L 292 180
      L 336 260
      L 384 200
      L 384 320
      L 128 320
      Z
    "/>
    <!-- Crown jewels -->
    <circle cx="176" cy="220" r="12" fill="#ef4444"/>
    <circle cx="256" cy="200" r="16" fill="#3b82f6"/>
    <circle cx="336" cy="220" r="12" fill="#22c55e"/>
    <!-- Crown base -->
    <rect x="128" y="320" width="256" height="40" rx="8" fill="url(#goldGrad)"/>
    <!-- Crown detail lines -->
    <rect x="148" y="328" width="216" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
    <rect x="148" y="340" width="216" height="4" rx="2" fill="#000000" opacity="0.2"/>
  </g>
  
  <!-- Sparkles -->
  <g fill="#fcd34d">
    <circle cx="140" cy="160" r="4" opacity="0.8"/>
    <circle cx="372" cy="160" r="3" opacity="0.6"/>
    <circle cx="120" cy="280" r="3" opacity="0.5"/>
    <circle cx="392" cy="280" r="4" opacity="0.7"/>
  </g>
</svg>
